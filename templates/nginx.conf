# nginx 站点配置（由 ovpn-oneclick 安装脚本生成）
#
#  1) 同源反代 /api —— 前端与 API 同源，浏览器不再发 CORS 预检请求
#  2) gzip —— 前端构建产物约 830KB，压缩后约 240KB
#  3) 默认只允许 VPN 隧道网段访问管理面板
#
# **面板托管的两段**（用 >>> / <<< 标记）：
#   面板里的「面板设置」页可以改监听端口、绑定域名、放行来源与 TLS，改动由 root
#   助手 /usr/local/lib/ovpnmanager/apply-panel-config 落在这两段里；安装脚本
#   （重装 / --update）也通过同一个渲染库 templates/panel-nginx.sh 重新生成这两段，
#   并且**优先读 /etc/ovpn-oneclick/panel.state**，所以升级不会把用户改过的值冲掉。
#   标记之外的内容（gzip、location、反代）两边都不动。

server {
    # >>> ovpn-oneclick panel listen (do not edit by hand) >>>
    # 对外端口由安装脚本渲染（默认 5698，**不是 80**）：80 常被同机其它站点占用，
    # 且不少云厂商对 80/443 有备案或拦截要求；管理入口单开端口也更好做安全组。
    listen __PANEL_WEB_PORT__;
    listen [::]:__PANEL_WEB_PORT__;
    server_name _;
    # <<< ovpn-oneclick panel listen <<<

    # >>> ovpn-oneclick panel allow (do not edit by hand) >>>
    allow __VPN_NETWORK__/__VPN_CIDR__;
    allow 127.0.0.1;
    deny all;
    # <<< ovpn-oneclick panel allow <<<

    root __WEB_ROOT__;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;

    location /__WEB_NAME__/ {
        try_files $uri $uri/ /__WEB_NAME__/index.html;
    }

    location ~* ^/__WEB_NAME__/assets/.*\.(js|css|woff2?|png|svg|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = / {
        return 302 /__WEB_NAME__/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 证书签发/吊销要跑 easyrsa 子进程，别让 nginx 先超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api/health/diagnostics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
    }

    # 一次性下载链接：这里**故意不限制来源**。
    # 同事拿到链接时还没连上 VPN；如果这里也继承 server 级的 allow/deny，链接就
    # 永远打不开（鸡生蛋）。安全性由令牌保证：一次性、限时、库里只存 sha256。
    location /share/ {
        allow all;
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
