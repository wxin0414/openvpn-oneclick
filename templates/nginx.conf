# nginx 站点配置（由 ovpn-oneclick 安装脚本生成）
#
#  1) 同源反代 /api —— 前端与 API 同源，浏览器不再发 CORS 预检请求
#  2) gzip —— 前端构建产物约 830KB，压缩后约 240KB
#  3) 默认只允许 VPN 隧道网段访问管理面板

server {
    # 对外端口由安装脚本渲染（默认 5698，**不是 80**）：80 常被同机其它站点占用，
    # 且不少云厂商对 80/443 有备案或拦截要求；管理入口单开端口也更好做安全组。
    listen __PANEL_WEB_PORT__;
    listen [::]:__PANEL_WEB_PORT__;
    server_name _;

    allow __VPN_NETWORK__/__VPN_CIDR__;
    allow 127.0.0.1;
    deny all;

    root __WEB_ROOT__;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;

    location /__WEB_NAME__/ {
        try_files $uri $uri/ /__WEB_NAME__/index.html;
    }

    location ~* ^/__WEB_NAME__/assets/.*\.(js|css|woff2?|png|svg|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = / {
        return 302 /__WEB_NAME__/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 证书签发/吊销要跑 easyrsa 子进程，别让 nginx 先超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api/health/diagnostics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
    }
}
