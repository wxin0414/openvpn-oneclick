# 容器内 nginx：只做两件事——发前端静态文件、反代 /api 与 /share。
# 与宿主机安装不同，这里不套 allow/deny（容器本身就只在映射的端口上暴露）。
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx-error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    server {
        listen 5698;
        server_name _;

        location /ovpnmanager/ {
            alias /opt/ovpnmanager/frontend/;
            try_files $uri $uri/ /ovpnmanager/index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # 一次性下载链接（与宿主机安装一致：公开，靠令牌校验）
        location /share/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = / {
            return 302 /ovpnmanager/;
        }
    }
}
